<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Fantasy IX - Triple Jeopardy</title>
    <style>
        :root {
            --ff9-window-blue-top: #102048;
            --ff9-window-blue-bot: #040818;
            --ff9-gold: #f8e08e;
            --ff9-bright-gold: #ffcc00;
            --ff9-text-white: #f0f0f0;
        }

        body {
            font-family: 'Times New Roman', Times, serif, sans-serif;
            background-color: #020208;
            background-image: radial-gradient(circle, #101c38 0%, #020208 100%);
            color: var(--ff9-text-white);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .ff9-container {
            max-width: 850px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--ff9-bright-gold);
            text-shadow: 2px 2px #000, 0 0 10px rgba(248, 224, 142, 0.4);
            font-family: Georgia, serif;
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-size: 2rem;
        }

        .subtitle {
            font-style: italic;
            color: #8da4c4;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        /* FFIX Style Menu Box */
        .ff9-box {
            background: linear-gradient(to bottom, var(--ff9-window-blue-top), var(--ff9-window-blue-bot));
            border: 3px solid var(--ff9-gold);
            border-radius: 6px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 10px rgba(16, 32, 72, 0.8);
            padding: 15px;
            margin-bottom: 20px;
        }

        .score-board {
            font-size: 1.3rem;
            display: inline-block;
            padding: 8px 25px;
            letter-spacing: 1px;
        }

        .score-board span {
            color: var(--ff9-bright-gold);
            font-weight: bold;
        }

        /* Board Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background-color: #010206;
            padding: 10px;
            border: 2px solid var(--ff9-gold);
            border-radius: 4px;
        }

        .category-header {
            background: linear-gradient(to bottom, #183060, #0c1830);
            color: var(--ff9-gold);
            padding: 12px 8px;
            font-weight: bold;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            border: 1px solid #304c80;
            text-shadow: 1px 1px #000;
            letter-spacing: 1px;
        }

        .clue-cell {
            background: linear-gradient(to bottom, #142850, #081024);
            color: var(--ff9-gold);
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid #283c68;
            transition: all 0.15s ease;
            text-shadow: 2px 2px #000;
        }

        .clue-cell:hover:not(.used) {
            background: linear-gradient(to bottom, #204080, #102040);
            border-color: var(--ff9-bright-gold);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .clue-cell.used {
            background: #04060c;
            color: #334055;
            border-color: #101420;
            cursor: not-allowed;
            text-shadow: none;
        }

        /* Modal / Dialog Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 4, 12, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            width: 80%;
            max-width: 550px;
            text-align: center;
            position: relative;
        }

        .modal-content h2 {
            color: var(--ff9-text-white);
            font-size: 1.4rem;
            line-height: 1.5;
            margin-bottom: 20px;
            font-weight: normal;
            text-align: left;
            padding-left: 10px;
            border-left: 4px solid var(--ff9-bright-gold);
        }

        .answer-reveal-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed var(--ff9-gold);
            padding: 10px;
            margin-bottom: 20px;
            font-size: 1.2rem;
            color: var(--ff9-bright-gold);
            display: none;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .ff9-btn {
            background: linear-gradient(to bottom, #284478, #142448);
            color: var(--ff9-gold);
            border: 2px solid var(--ff9-gold);
            padding: 8px 22px;
            font-size: 1rem;
            font-weight: bold;
            font-family: 'Times New Roman', Times, serif;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .ff9-btn:hover {
            background: linear-gradient(to bottom, #385c9c, #20386c);
            color: #fff;
        }

        .ff9-btn.correct {
            border-color: #66cc66;
            color: #88ff88;
        }

        .ff9-btn.incorrect {
            border-color: #cc6666;
            color: #ff8888;
        }

        .feedback {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <div class="ff9-container">
        <h1>MOGNET JEOPARDY</h1>
        <div class="subtitle">~ Test your knowledge across the Mist Continent ~</div>
        
        <div class="ff9-box score-board">
            Gil (Score): <span id="score">0</span>
        </div>

        <div class="board" id="game-board">
            <!-- Dynamic Grid Generated via JS -->
        </div>
    </div>

    <!-- Question Dialog Modal -->
    <div class="modal" id="question-modal">
        <div class="ff9-box modal-content">
            <h2 id="modal-question">Loading query...</h2>
            
            <div id="hidden-answer-container" class="answer-reveal-box">
                Answer: <span id="modal-answer-text"></span>
            </div>

            <div id="action-buttons" class="button-group">
                <button class="ff9-btn" id="reveal-btn" onclick="revealAnswer()">Reveal Answer</button>
            </div>

            <div id="grading-buttons" class="button-group" style="display: none;">
                <button class="ff9-btn correct" onclick="markAnswer(true)">Correct (+)</button>
                <button class="ff9-btn incorrect" onclick="markAnswer(false)">Incorrect (-)</button>
            </div>

            <div class="feedback" id="modal-feedback"></div>
        </div>
    </div>

    <script>
        const gameData = [
            {
                category: "Gaia & Mist",
                clues: [
                    { value: 200, question: "What substance blankets the Mist Continent, spawning monsters when it gathers?", answer: "Mist" },
                    { value: 400, question: "Name the grand capital city ruled by Queen Brahne.", answer: "Alexandria" },
                    { value: 600, question: "This massive tree acts as the source of the Mist and connects Terra to Gaia.", answer: "Iifa Tree" }
                ]
            },
            {
                category: "Party Members",
                clues: [
                    { value: 200, question: "He is a young black mage with a mysterious past who questions his own existence.", answer: "Vivi" },
                    { value: 400, question: "This thief with a tail is a member of the Tantalus theater troupe.", answer: "Zidane" },
                    { value: 600, question: "A female dragon knight from Burmecia seeking to defend her homeland.", answer: "Freya" }
                ]
            },
            {
                category: "Treasures & Lore",
                clues: [
                    { value: 200, question: "What collectible card game replaces Triple Triad in Final Fantasy IX?", answer: "Tetra Master" },
                    { value: 400, question: "What winged, letter-delivering creatures act as your save points and companions?", answer: "Moogles" },
                    { value: 600, question: "What is the name of Zidane's ultimate trance ability/attack?", answer: "Solution 9" }
                ]
            }
        ];

        let score = 0;
        let activeClue = null;

        const boardElement = document.getElementById("game-board");
        const scoreElement = document.getElementById("score");
        const modalElement = document.getElementById("question-modal");
        const modalQuestion = document.getElementById("modal-question");
        const modalAnswerText = document.getElementById("modal-answer-text");
        const hiddenAnswerContainer = document.getElementById("hidden-answer-container");
        const revealBtnContainer = document.getElementById("action-buttons");
        const gradingButtons = document.getElementById("grading-buttons");
        const modalFeedback = document.getElementById("modal-feedback");

        function initBoard() {
            boardElement.innerHTML = "";
            
            gameData.forEach(cat => {
                const header = document.createElement("div");
                header.className = "category-header";
                header.innerText = cat.category;
                boardElement.appendChild(header);
            });

            for (let i = 0; i < 3; i++) {
                gameData.forEach((cat, catIndex) => {
                    const clue = cat.clues[i];
                    const cell = document.createElement("div");
                    cell.className = "clue-cell";
                    cell.innerText = `${clue.value}G`;
                    
                    cell.addEventListener("click", () => openClue(catIndex, i, cell));
                    boardElement.appendChild(cell);
                });
            }
        }

        function openClue(catIndex, clueIndex, cellElement) {
            if (cellElement.classList.contains("used")) return;

            activeClue = {
                data: gameData[catIndex].clues[clueIndex],
                element: cellElement
            };

            modalQuestion.innerText = activeClue.data.question;
            modalAnswerText.innerText = activeClue.data.answer;
            
            // Reset modal states
            hiddenAnswerContainer.style.display = "none";
            revealBtnContainer.style.display = "flex";
            gradingButtons.style.display = "none";
            modalFeedback.innerText = "";

            modalElement.style.display = "flex";
        }

        function revealAnswer() {
            hiddenAnswerContainer.style.display = "block";
            revealBtnContainer.style.display = "none";
            gradingButtons.style.display = "flex";
        }

        function markAnswer(isCorrect) {
            gradingButtons.style.display = "none";

            if (isCorrect) {
                score += activeClue.data.value;
                modalFeedback.style.color = "var(--ff9-bright-gold)";
                modalFeedback.innerText = `Correct! +${activeClue.data.value}G`;
            } else {
                score -= activeClue.data.value;
                modalFeedback.style.color = "#ff6666";
                modalFeedback.innerText = `Incorrect. -${activeClue.data.value}G`;
            }

            scoreElement.innerText = score;
            activeClue.element.classList.add("used");

            setTimeout(() => {
                modalElement.style.display = "none";
                checkGameOver();
            }, 1800);
        }

        function checkGameOver() {
            const remaining = document.querySelectorAll(".clue-cell:not(.used)");
            if (remaining.length === 0) {
                setTimeout(() => {
                    alert(`The journey ends here! Final Gil earned: ${score}G`);
                }, 500);
            }
        }

        initBoard();
    </script>
</body>
</html>
